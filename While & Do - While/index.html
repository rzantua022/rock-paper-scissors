<!DOCTYPE html>
<html>

<head>

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>🪨 Rock Paper Scissors ✂️</h1>

    <h2>First to 5 Wins!</h2>


    <!-- =================================
         ANIMATED BATTLE AREA
    ================================== -->

    <div class="battle-area">

        <!-- PLAYER -->

        <div class="player-side">

            <h3>YOU</h3>

            <div class="image-box">

                <img
                    id="playerImage"
                    src="Image/rock.webp"
                    alt="Player choice"
                >

            </div>

        </div>


        <!-- VS -->

        <div class="vs">

            VS

        </div>


        <!-- COMPUTER -->

        <div class="player-side">

            <h3>COMPUTER</h3>

            <div class="image-box">

                <img
                    id="computerImage"
                    src="Image/rock.webp"
                    alt="Computer choice"
                >

            </div>

        </div>

    </div>


    <!-- =================================
         CHOICES
    ================================== -->

    <div
        class="choices"
        id="choices"
    >

        <button onclick="playRound('rock')">

            🪨
            <br>
            Rock

        </button>


        <button onclick="playRound('paper')">

            📄
            <br>
            Paper

        </button>


        <button onclick="playRound('scissors')">

            ✂️
            <br>
            Scissors

        </button>

    </div>


    <!-- =================================
         RESULT
    ================================== -->

    <div id="result">

        Choose your move!

    </div>


    <!-- =================================
         SCORE
    ================================== -->

    <div id="score">

        You: 0 | Computer: 0

    </div>


    <!-- =================================
         PLAY AGAIN
    ================================== -->

    <button
        id="playAgain"
        onclick="newGame()"
    >

        🔄 Play Again

    </button>


    <script src="script.js"></script>

</body>

</html>
